<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tic Tac Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --surface: #12121e;
    --surface2: #1a1a2e;
    --x-color: #ff4d6d;
    --o-color: #4cc9f0;
    --accent: #7b2fff;
    --text: #e8e8f0;
    --muted: #6b6b88;
    --win-glow: #ffd166;
    --border: #2a2a40;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
 
  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }
 
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 20% 20%, rgba(123,47,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(76,201,240,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255,77,109,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
 
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
 
  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--x-color), var(--accent), var(--o-color));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    animation: pulse-logo 3s ease-in-out infinite;
  }
 
  @keyframes pulse-logo {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }
 
  /* ── SCREENS ── */
  .screen { width: 100%; display: none; flex-direction: column; align-items: center; gap: 16px; }
  .screen.active { display: flex; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
 
  /* ── MENU SCREEN ── */
  .menu-label {
    font-size: 0.85rem;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }
 
  .mode-btn {
    width: 100%;
    padding: 18px 24px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.2s;
    font-family: 'Rajdhani', sans-serif;
  }
 
  .mode-btn:hover, .mode-btn:active { border-color: var(--accent); background: var(--surface2); transform: scale(1.02); }
 
  .mode-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
  }
 
  .mode-icon.friend { background: rgba(255,77,109,0.15); }
  .mode-icon.ai { background: rgba(76,201,240,0.15); }
 
  .mode-info { text-align: left; }
  .mode-title { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
  .mode-sub { font-size: 0.85rem; color: var(--muted); }
 
  /* ── DIFFICULTY SCREEN ── */
  .back-btn {
    align-self: flex-start;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--muted); }
 
  .diff-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; }
 
  .diff-btn {
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
  }
 
  .diff-btn.easy:hover, .diff-btn.easy:active { border-color: #4cc9f0; background: rgba(76,201,240,0.08); }
  .diff-btn.medium:hover, .diff-btn.medium:active { border-color: #ffd166; background: rgba(255,209,102,0.08); }
  .diff-btn.hard:hover, .diff-btn.hard:active { border-color: #ff4d6d; background: rgba(255,77,109,0.08); }
 
  .diff-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .easy .diff-dot { background: #4cc9f0; box-shadow: 0 0 8px #4cc9f0; }
  .medium .diff-dot { background: #ffd166; box-shadow: 0 0 8px #ffd166; }
  .hard .diff-dot { background: #ff4d6d; box-shadow: 0 0 8px #ff4d6d; }
 
  .diff-title { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
  .diff-desc { font-size: 0.82rem; color: var(--muted); }
 
  /* ── GAME SCREEN ── */
  .game-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
 
  .game-meta { font-size: 0.78rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .game-meta span { color: var(--accent); }
 
  .scores {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
  }
 
  .score-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    transition: border-color 0.3s;
  }
 
  .score-card.x-card { border-color: rgba(255,77,109,0.3); }
  .score-card.o-card { border-color: rgba(76,201,240,0.3); }
  .score-card.active-turn.x-card { border-color: var(--x-color); box-shadow: 0 0 16px rgba(255,77,109,0.2); }
  .score-card.active-turn.o-card { border-color: var(--o-color); box-shadow: 0 0 16px rgba(76,201,240,0.2); }
 
  .score-player { font-size: 0.72rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .score-mark { font-family: 'Orbitron', monospace; font-size: 1.1rem; font-weight: 700; }
  .score-mark.x { color: var(--x-color); }
  .score-mark.o { color: var(--o-color); }
  .score-num { font-family: 'Orbitron', monospace; font-size: 1.6rem; font-weight: 700; color: var(--text); }
 
  .vs-badge {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-align: center;
  }
 
  .turn-indicator {
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
    text-transform: uppercase;
  }
 
  .turn-indicator span { font-weight: 700; }
  .turn-indicator .tx { color: var(--x-color); }
  .turn-indicator .to { color: var(--o-color); }
 
  /* ── BOARD ── */
  .board-wrap {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1;
    position: relative;
  }
 
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    height: 100%;
  }
 
  .cell {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 9vw, 3.2rem);
    font-weight: 900;
    transition: background 0.15s, transform 0.1s, border-color 0.2s;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
 
  .cell:hover:not(.taken) { background: var(--surface2); border-color: var(--accent); transform: scale(1.04); }
  .cell:active:not(.taken) { transform: scale(0.97); }
 
  .cell.taken { cursor: default; }
  .cell.x-mark { color: var(--x-color); border-color: rgba(255,77,109,0.4); animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1); }
  .cell.o-mark { color: var(--o-color); border-color: rgba(76,201,240,0.4); animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1); }
  .cell.winner { animation: winGlow 0.6s ease forwards; }
  .cell.winner.x-mark { border-color: var(--x-color); background: rgba(255,77,109,0.15); }
  .cell.winner.o-mark { border-color: var(--o-color); background: rgba(76,201,240,0.15); }
 
  @keyframes popIn {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
 
  @keyframes winGlow {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
 
  /* ── STATUS MESSAGE ── */
  .status {
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.9rem, 3vw, 1.1rem);
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
    min-height: 28px;
    padding: 6px 16px;
    border-radius: 8px;
    transition: all 0.3s;
  }
 
  .status.win-x { color: var(--x-color); background: rgba(255,77,109,0.1); }
  .status.win-o { color: var(--o-color); background: rgba(76,201,240,0.1); }
  .status.draw { color: var(--win-glow); background: rgba(255,209,102,0.1); }
 
  /* ── BUTTONS ── */
  .btn-row { display: flex; gap: 10px; width: 100%; }
 
  .action-btn {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
 
  .action-btn:hover { background: var(--surface2); border-color: var(--accent); }
  .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .action-btn.primary:hover { background: #6a1fff; }
 
  /* ── WIN LINE OVERLAY ── */
  .win-line-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
 
  .win-line-svg line {
    stroke: var(--win-glow);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 320;
    stroke-dashoffset: 320;
    animation: drawLine 0.4s ease forwards 0.1s;
  }
 
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }
 
  /* ── THINKING ── */
  .thinking { display: none; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem; letter-spacing: 2px; }
  .thinking.show { display: flex; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--o-color); animation: bounce 1s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }
 
  /* ── DRAW LINES ── */
  .board-grid-lines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
 
  @media (max-width: 400px) {
    .mode-icon { width: 40px; height: 40px; font-size: 1.3rem; }
    .mode-title { font-size: 1.1rem; }
    .score-num { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">TIC TAC TOE</div>
 
  <!-- MENU SCREEN -->
  <div class="screen active" id="menuScreen">
    <div class="menu-label">Choose Mode</div>
    <button class="mode-btn" onclick="showScreen('gameScreen', 'friend')">
      <div class="mode-icon friend">🤝</div>
      <div class="mode-info">
        <div class="mode-title">VS FRIEND</div>
        <div class="mode-sub">2 players on same device</div>
      </div>
    </button>
    <button class="mode-btn" onclick="showScreen('diffScreen')">
      <div class="mode-icon ai">🤖</div>
      <div class="mode-info">
        <div class="mode-title">VS AI</div>
        <div class="mode-sub">Easy · Medium · Hard</div>
      </div>
    </button>
  </div>
 
  <!-- DIFFICULTY SCREEN -->
  <div class="screen" id="diffScreen">
    <button class="back-btn" onclick="showScreen('menuScreen')">← BACK</button>
    <div class="menu-label">Select Difficulty</div>
    <div class="diff-grid">
      <button class="diff-btn easy" onclick="showScreen('gameScreen','ai','easy')">
        <div class="diff-dot"></div>
        <div>
          <div class="diff-title">EASY</div>
          <div class="diff-desc">Random moves — great for beginners</div>
        </div>
      </button>
      <button class="diff-btn medium" onclick="showScreen('gameScreen','ai','medium')">
        <div class="diff-dot"></div>
        <div>
          <div class="diff-title">MEDIUM</div>
          <div class="diff-desc">Blocks wins, sometimes strategic</div>
        </div>
      </button>
      <button class="diff-btn hard" onclick="showScreen('gameScreen','ai','hard')">
        <div class="diff-dot"></div>
        <div>
          <div class="diff-title">HARD</div>
          <div class="diff-desc">Perfect play — unbeatable AI</div>
        </div>
      </button>
    </div>
  </div>
 
  <!-- GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <div class="game-header">
      <button class="back-btn" onclick="goBack()" style="margin:0">← MENU</button>
      <div class="game-meta" id="modeBadge">VS FRIEND</div>
    </div>
 
    <div class="scores">
      <div class="score-card x-card active-turn" id="scoreX">
        <div class="score-player">Player 1</div>
        <div class="score-mark x">X</div>
        <div class="score-num" id="scoreXNum">0</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="score-card o-card" id="scoreO">
        <div class="score-player" id="p2Label">Player 2</div>
        <div class="score-mark o">O</div>
        <div class="score-num" id="scoreONum">0</div>
      </div>
    </div>
 
    <div class="turn-indicator" id="turnInd">
      <span class="tx">X</span> — Player 1's Turn
    </div>
 
    <div class="thinking" id="thinking">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span>AI thinking…</span>
    </div>
 
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <svg class="win-line-svg" id="winSvg" viewBox="0 0 300 300" preserveAspectRatio="none"></svg>
    </div>
 
    <div class="status" id="status"></div>
 
    <div class="btn-row">
      <button class="action-btn" onclick="resetGame()">RESET</button>
      <button class="action-btn primary" onclick="newGame()">NEW GAME</button>
    </div>
  </div>
</div>
 
<script>
// ── STATE ──
let mode = 'friend';
let difficulty = 'easy';
let board = Array(9).fill('');
let currentPlayer = 'X';
let gameOver = false;
let scores = { X: 0, O: 0 };
let winCombos = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];
 
// ── NAVIGATION ──
function showScreen(id, m, diff) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'gameScreen') {
    mode = m || 'friend';
    difficulty = diff || 'easy';
    scores = { X: 0, O: 0 };
    updateScoreDisplay();
    initGame();
    document.getElementById('modeBadge').textContent = mode === 'friend' ? 'VS FRIEND' : 'VS AI — ' + difficulty.toUpperCase();
    document.getElementById('p2Label').textContent = mode === 'ai' ? 'AI' : 'Player 2';
  }
}
 
function goBack() {
  if (mode === 'ai') showScreen('diffScreen');
  else showScreen('menuScreen');
}
 
// ── GAME INIT ──
function initGame() {
  board = Array(9).fill('');
  currentPlayer = 'X';
  gameOver = false;
  document.getElementById('winSvg').innerHTML = '';
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = 'status';
  document.getElementById('thinking').classList.remove('show');
  renderBoard();
  updateTurnIndicator();
  updateScoreCards();
}
 
function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  board.forEach((val, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (val ? ' taken ' + (val === 'X' ? 'x-mark' : 'o-mark') : '');
    cell.textContent = val;
    cell.dataset.index = i;
    if (!val && !gameOver) cell.onclick = () => handleClick(i);
    boardEl.appendChild(cell);
  });
}
 
// ── GAME LOGIC ──
function handleClick(index) {
  if (gameOver || board[index]) return;
  if (mode === 'ai' && currentPlayer === 'O') return;
 
  makeMove(index, currentPlayer);
  const result = checkResult();
  if (result) { handleEnd(result); return; }
 
  currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
  updateTurnIndicator();
  updateScoreCards();
 
  if (mode === 'ai' && currentPlayer === 'O' && !gameOver) {
    document.getElementById('thinking').classList.add('show');
    setTimeout(() => {
      document.getElementById('thinking').classList.remove('show');
      const aiMove = getAIMove();
      makeMove(aiMove, 'O');
      const r = checkResult();
      if (r) { handleEnd(r); return; }
      currentPlayer = 'X';
      updateTurnIndicator();
      updateScoreCards();
    }, 500 + Math.random() * 400);
  }
}
 
function makeMove(index, player) {
  board[index] = player;
  renderBoard();
}
 
function checkResult() {
  for (let combo of winCombos) {
    const [a,b,c] = combo;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      return { winner: board[a], combo };
    }
  }
  if (board.every(c => c)) return { winner: 'draw' };
  return null;
}
 
function handleEnd(result) {
  gameOver = true;
  const statusEl = document.getElementById('status');
  if (result.winner === 'draw') {
    statusEl.textContent = "IT'S A DRAW!";
    statusEl.className = 'status draw';
  } else {
    scores[result.winner]++;
    updateScoreDisplay();
    if (result.winner === 'X') {
      statusEl.textContent = mode === 'friend' ? 'PLAYER 1 WINS!' : 'YOU WIN! 🎉';
      statusEl.className = 'status win-x';
    } else {
      statusEl.textContent = mode === 'friend' ? 'PLAYER 2 WINS!' : 'AI WINS! 🤖';
      statusEl.className = 'status win-o';
    }
    highlightWinners(result.combo);
    drawWinLine(result.combo);
  }
  document.getElementById('turnInd').textContent = '';
}
 
function highlightWinners(combo) {
  const cells = document.querySelectorAll('.cell');
  combo.forEach(i => cells[i].classList.add('winner'));
}
 
function drawWinLine(combo) {
  const positions = [
    [50,50],[150,50],[250,50],
    [50,150],[150,150],[250,150],
    [50,250],[150,250],[250,250]
  ];
  const [a,,c] = combo;
  const [x1,y1] = positions[a];
  const [x2,y2] = positions[c];
  const svg = document.getElementById('winSvg');
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  svg.appendChild(line);
}
 
function updateTurnIndicator() {
  const el = document.getElementById('turnInd');
  if (currentPlayer === 'X') {
    el.innerHTML = '<span class="tx">X</span> — ' + (mode === 'friend' ? "Player 1's Turn" : "Your Turn");
  } else {
    el.innerHTML = '<span class="to">O</span> — ' + (mode === 'friend' ? "Player 2's Turn" : "AI's Turn");
  }
}
 
function updateScoreCards() {
  document.getElementById('scoreX').classList.toggle('active-turn', currentPlayer === 'X' && !gameOver);
  document.getElementById('scoreO').classList.toggle('active-turn', currentPlayer === 'O' && !gameOver);
}
 
function updateScoreDisplay() {
  document.getElementById('scoreXNum').textContent = scores.X;
  document.getElementById('scoreONum').textContent = scores.O;
}
 
function resetGame() { initGame(); }
function newGame() { scores = { X: 0, O: 0 }; updateScoreDisplay(); initGame(); }
 
// ── AI ──
function getAIMove() {
  if (difficulty === 'easy') return getRandomMove();
  if (difficulty === 'medium') return getMediumMove();
  return getBestMove();
}
 
function getRandomMove() {
  const available = board.map((v,i) => v ? null : i).filter(v => v !== null);
  return available[Math.floor(Math.random() * available.length)];
}
 
function getMediumMove() {
  // Win if possible
  let move = findWinning('O');
  if (move !== -1) return move;
  // Block player
  move = findWinning('X');
  if (move !== -1) return move;
  // Take center
  if (!board[4]) return 4;
  // Take corner
  const corners = [0,2,6,8].filter(i => !board[i]);
  if (corners.length && Math.random() > 0.4) return corners[Math.floor(Math.random()*corners.length)];
  return getRandomMove();
}
 
function findWinning(player) {
  for (let combo of winCombos) {
    const [a,b,c] = combo;
    const vals = [board[a],board[b],board[c]];
    if (vals.filter(v => v === player).length === 2 && vals.includes('')) {
      return combo[vals.indexOf('')];
    }
  }
  return -1;
}
 
function getBestMove() {
  let bestScore = -Infinity, bestMove = -1;
  for (let i = 0; i < 9; i++) {
    if (!board[i]) {
      board[i] = 'O';
      let score = minimax(board, 0, false, -Infinity, Infinity);
      board[i] = '';
      if (score > bestScore) { bestScore = score; bestMove = i; }
    }
  }
  return bestMove;
}
 
function minimax(b, depth, isMax, alpha, beta) {
  const r = checkResult();
  if (r) {
    if (r.winner === 'O') return 10 - depth;
    if (r.winner === 'X') return depth - 10;
    return 0;
  }
  if (isMax) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = 'O';
        best = Math.max(best, minimax(b, depth+1, false, alpha, beta));
        b[i] = '';
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = 'X';
        best = Math.min(best, minimax(b, depth+1, true, alpha, beta));
        b[i] = '';
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
    }
    return best;
  }
}
